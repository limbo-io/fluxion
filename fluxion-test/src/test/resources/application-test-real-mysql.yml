# 真实 MySQL 集成测试 profile（-Pmysql-integration-test）
# 目标类：integration/mysql/DistributedLockMySqlTest（MySQL 原生 ON DUPLICATE KEY 语义，H2 无法表达）
# 连接信息可用环境变量覆盖：
#   FLUXION_TEST_MYSQL_HOST / FLUXION_TEST_MYSQL_PORT / FLUXION_TEST_MYSQL_DB
#   FLUXION_TEST_MYSQL_USER / FLUXION_TEST_MYSQL_PASSWORD
spring:
  application:
    name: fluxion-test-real-mysql
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${FLUXION_TEST_MYSQL_HOST:127.0.0.1}:${FLUXION_TEST_MYSQL_PORT:3306}/${FLUXION_TEST_MYSQL_DB:fluxion_test}?useUnicode=true&characterEncoding=UTF-8&allowMultiQueries=true&serverTimezone=Asia/Shanghai
    username: ${FLUXION_TEST_MYSQL_USER:root}
    password: ${FLUXION_TEST_MYSQL_PASSWORD:}
    hikari:
      connection-test-query: SELECT 1
      connection-init-sql: set names utf8mb4
  jpa:
    hibernate:
      # 测试库幂等重建：按实体注解建表（含 fluxion_lock），退出时 drop
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_updates: true
        order_inserts: true