# 测试环境配置
spring:
  application:
    name: fluxion-test

  # H2 内存数据库配置
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # JPA/Hibernate 配置
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # SQL 初始化（暂时禁用，数据库结构由应用自动维护）
  sql:
    init:
      mode: never

  # H2 Console(调试用)
  h2:
    console:
      enabled: true
      path: /h2-console

  # 禁用 Flyway（H2 不支持部分 SQL 语法）
  flyway:
    enabled: false

# Fluxion Broker 配置 (Server 端)
fluxion:
  broker:
    host: 127.0.0.1
    port: 19785  # 测试端口
    protocol: HTTP

  # Fluxion Worker 配置
  worker:
    enabled: true
    auto-start: false  # 禁用自动启动，改为手动控制
    appName: fluxion-test-worker
    host: 127.0.0.1
    port: 19787  # 测试端口
    protocol: HTTP
    brokers:
      - http://127.0.0.1:19785
    concurrency: 10
    queueSize: 100

# 日志配置
logging:
  level:
    io.fluxion: DEBUG
    org.springframework.jdbc: DEBUG
