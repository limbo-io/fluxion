# MySQL Integration Test Configuration
spring:
  application:
    name: fluxion-test-mysql

  # Datasource will be configured dynamically via AbstractMySqlIntegrationTest
  # These are placeholders that will be overridden
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA Configuration for MySQL 8
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
        order_updates: true
        order_inserts: true

  # Flyway for schema migration
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: false

# Disable automatic broker/worker startup for tests
fluxion:
  broker:
    enabled: false
  worker:
    enabled: false

# Logging
logging:
  level:
    io.fluxion: DEBUG
    org.springframework.jdbc: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
