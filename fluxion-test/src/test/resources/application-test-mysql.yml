# H2 Integration Test Configuration (legacy profile name retained temporarily)
spring:
  application:
    name: fluxion-test-h2-integration

  datasource:
    # LOCK_TIMEOUT=10000：唯一索引/行锁竞争的等待窗口拉长到 10s。默认 1s 会让并发竞争
    # 直接流为锁等待超时（HYT00/50200），无法覆盖“竞争点插锁等待→对方提交→唯一键冲突”的真路径。
    url: jdbc:h2:mem:integrationdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;LOCK_TIMEOUT=10000
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
          # 运行态时间统一 UTC：与生产同口径
          time_zone: UTC
        order_updates: true
        order_inserts: true

  flyway:
    enabled: false

# Disable automatic broker/worker startup for tests
fluxion:
  broker:
    enabled: false
  worker:
    enabled: false

# Logging
logging:
  level:
    io.fluxion: DEBUG
    org.springframework.jdbc: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
