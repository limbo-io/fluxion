# H2 Integration Test Configuration (legacy profile name retained temporarily)
spring:
  application:
    name: fluxion-test-h2-integration

  datasource:
    url: jdbc:h2:mem:integrationdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
        order_updates: true
        order_inserts: true

  flyway:
    enabled: false

# Disable automatic broker/worker startup for tests
fluxion:
  broker:
    enabled: false
  worker:
    enabled: false

# Logging
logging:
  level:
    io.fluxion: DEBUG
    org.springframework.jdbc: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
