name: CI

on:
  push:
    branches: [ master, develop, main ]
  pull_request:
    branches: [ master, develop, main ]

jobs:
  # 编译检查
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile
        run: mvn -q -DskipTests compile

  # T4.6 CI 门禁: 非 MySQL 回归测试
  regression-test:
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Regression Tests
        run: mvn test -pl fluxion-test -am -Pregression-test --batch-mode

  # T4.6 CI 门禁: H2 集成测试
  h2-integration-test:
    runs-on: ubuntu-latest
    needs: regression-test
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run H2 Integration Tests
        run: mvn test -pl fluxion-test -am -Ph2-integration-test --batch-mode

  # T4.6 CI 门禁: 合并要求
  # 所有测试通过后，此 job 成功，PR 可合并
  all-tests-passed:
    runs-on: ubuntu-latest
    needs: [regression-test, h2-integration-test]
    if: always()
    steps:
      - name: Check if all tests passed
        run: |
          if [ "${{ needs.regression-test.result }}" != "success" ] || [ "${{ needs.h2-integration-test.result }}" != "success" ]; then
            echo "❌ Not all tests passed. Blocking merge."
            exit 1
          fi
          echo "✅ All tests passed. Ready to merge."
