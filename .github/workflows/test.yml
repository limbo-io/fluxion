name: Test

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  # 快速单元测试（非 MySQL 测试）
  unit-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Run Unit Tests
      run: mvn test -pl fluxion-test -am --batch-mode

  # 回归测试
  regression-test:
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Run Regression Tests
      run: mvn test -pl fluxion-test -am -Pregression-test --batch-mode

  # H2 集成测试
  h2-integration-test:
    runs-on: ubuntu-latest
    needs: regression-test
    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Run H2 Integration Tests
      run: mvn test -pl fluxion-test -am -Ph2-integration-test --batch-mode

  all-tests-passed:
    runs-on: ubuntu-latest
    needs: [unit-test, regression-test, h2-integration-test]
    if: always()
    steps:
    - name: Check test gates
      run: |
        if [ "${{ needs.unit-test.result }}" != "success" ] || [ "${{ needs.regression-test.result }}" != "success" ] || [ "${{ needs.h2-integration-test.result }}" != "success" ]; then
          exit 1
        fi
