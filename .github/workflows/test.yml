name: Test

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  # 快速单元测试（非 MySQL 测试）
  unit-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Run Unit Tests
      run: mvn test -pl fluxion-test -am --batch-mode

  # 回归测试
  regression-test:
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Run Regression Tests
      run: mvn test -pl fluxion-test -am -Pregression-test --batch-mode

  # MySQL 集成测试
  mysql-integration-test:
    runs-on: ubuntu-latest
    needs: regression-test
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: fluxion_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Run MySQL Integration Tests
      run: mvn test -pl fluxion-test -am -Pmysql-integration-test --batch-mode
      env:
        FLUXION_TEST_MYSQL_URL: jdbc:mysql://localhost:3306/fluxion_test
        FLUXION_TEST_MYSQL_USERNAME: root
        FLUXION_TEST_MYSQL_PASSWORD: root

  all-tests-passed:
    runs-on: ubuntu-latest
    needs: [unit-test, regression-test, mysql-integration-test]
    if: always()
    steps:
    - name: Check test gates
      run: |
        if [ "${{ needs.unit-test.result }}" != "success" ] || [ "${{ needs.regression-test.result }}" != "success" ] || [ "${{ needs.mysql-integration-test.result }}" != "success" ]; then
          exit 1
        fi
