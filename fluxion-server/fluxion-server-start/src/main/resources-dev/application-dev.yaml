server:
  port: 9786

spring:
  datasource:
    # H2 开发数据库（替代 MySQL）
    driver-class-name: net.sf.log4jdbc.sql.jdbcapi.DriverSpy
    url: jdbc:log4jdbc:h2:./fluxion_dev;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false;MODE=mysql;
    username: sa
    password: 
    hikari:
      connection-test-query: SELECT 1
  
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  
  # H2 Console（开发调试）
  h2:
    console:
      path: /h2-console
      enabled: true

# 开发环境日志级别
logging:
  level:
    io.fluxion: DEBUG
    org.hibernate.SQL: DEBUG
