server:
  port: 9786

spring:
  profiles:
    active: @profiles.active@
  application:
    name: fluxion
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/fluxion?useUnicode=true&characterEncoding=UTF-8&allowMultiQueries=true&serverTimezone=Asia/Shanghai
    username: root
    password: 
    hikari:
      connection-test-query: SELECT 1
      connection-init-sql: set names utf8mb4
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        enable_lazy_load_no_trans: true
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
    enabled: true

# log
logging:
  config: classpath:log4j2.xml

# fluxion broker configuration
fluxion:
  broker:
    host: 
    port: 9785
    protocol: HTTP
  
  # fluxion fault tolerance configuration
  fault-tolerance:
    retry:
      max-retries: 5
      initial-delay: 1s
      max-delay: 30s
      multiplier: 2.0
      jitter: 0.1
    timeout:
      default-timeout: 30m
    failover:
      enabled: true
      worker-offline-timeout: 10s
      max-migrations: 3
